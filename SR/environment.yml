name: vsleem360-sr
channels: [pytorch, nvidia, conda-forge, nodefaults]
dependencies:
  - python=3.10
  - ffmpeg=6.1
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.1.4
  - pillow=10.2.0
  - opencv=4.8.1
  - pip=23.3.2
  # MMCV 2.1.0 setup.py imports pkg_resources, removed in setuptools 81+.
  - setuptools=69.5.1
  - pip:
      # Official OpenMMLab wheel index for PyTorch 2.1 / CUDA 11.8.
      - --find-links https://download.openmmlab.com/mmcv/dist/cu118/torch2.1/index.html
      - mmengine==0.10.3
      - mmcv==2.1.0
      - mmagic==1.2.0
      # MMagic 1.2.0 declares only lower bounds; newer 2026 releases require
      # PyTorch >=2.4 and break MMagic's eager top-level model imports.
      - diffusers==0.24.0
      - transformers==4.35.2
      - huggingface-hub==0.19.4
      # PackInputs imports the complete MMagic transform package; this is an
      # official MMagic optional dependency required by our training pipeline.
      - albumentations==1.3.1
      - lpips==0.1.4
      - pyiqa==0.1.10
      - tqdm==4.66.1
